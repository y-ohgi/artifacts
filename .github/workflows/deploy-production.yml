name: Deploy (production)

on:
  # TODO: 本番Cloudflareリソース(R2バケット・D1データベース・カスタムドメイン)を
  # 作成し、wrangler.jsonc の env.production の REPLACE_* を実値に置き換え、
  # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID を "production" environment の
  # secretsに設定してから、以下の push トリガーのコメントアウトを解除する。
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - "**/*.md"
  #     - "docs/**"
  #     - "specs/**"
  #     - "harness/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run migrate:remote:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
